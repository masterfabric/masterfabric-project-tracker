# ──────────────────────────────────────────────────────────────────────────────
# MasterFabric mf-go — Fly.io deployment
# Repo root: masterfabric-expo-base/
#
# Deploy (from repo root): fly deploy ./mf-go --config ../fly.toml
# (--config is relative to build context mf-go, so ../fly.toml = root)
#
# Before first deploy:
#   fly postgres create   (or attach existing)
#   fly redis create     (or use Upstash Redis)
#   fly secrets set DATABASE_DSN="postgres://..." REDIS_URL="redis://..." JWT_SECRET="..."
# ──────────────────────────────────────────────────────────────────────────────

app = "mf-go"
primary_region = "fra"

[build]
  dockerfile = "deployments/Dockerfile"

[env]
  RABBITMQ_ENABLED = "false"
  JWT_ACCESS_TTL = "15m"
  JWT_REFRESH_TTL = "168h"
  LOG_LEVEL = "info"
  LOG_FORMAT = "json"
  GRAPHQL_INTROSPECTION = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
