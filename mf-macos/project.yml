name: MFProjectTracker
options:
  bundleIdPrefix: com.masterfabric
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MFTrackerKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Team ID from Apple Development cert (codesign TeamIdentifier).
    DEVELOPMENT_TEAM: "4GW994398K"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

configFiles:
  Debug: Configs/Env.xcconfig
  Release: Configs/Env.xcconfig

targets:
  MFProjectTracker:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: MFTrackerKit
        product: MFTrackerKit
      - target: MFTrackerWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masterfabric.projectTracker.macos
        PRODUCT_NAME: MF Project Tracker
        INFOPLIST_FILE: Configs/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configs/App.entitlements
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        ENABLE_HARDENED_RUNTIME: false
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Env.xcconfig (+ GeneratedEnv from sync-env) supplies GRAPHQL_URL / MF_* keys.
        # Do not set MF_APP_API_KEY here — an empty target setting overrides the xcconfig secret.
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGNING_REQUIRED: true
        CODE_SIGNING_ALLOWED: true
        DEVELOPMENT_TEAM: "4GW994398K"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Configs/App-Info.plist
      properties:
        CFBundleDisplayName: MF Project Tracker
        CFBundleName: MF Project Tracker
        CFBundleShortVersionString: "1.0.12"
        CFBundleVersion: "12"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        GRAPHQL_URL: $(GRAPHQL_URL)
        MF_CLIENT_BUNDLE_ID: $(MF_CLIENT_BUNDLE_ID)
        MF_APP_API_KEY: $(MF_APP_API_KEY)
        MF_PROJECT_TRACKER_PARTICULAR: $(MF_PROJECT_TRACKER_PARTICULAR)
        CFBundleURLTypes:
          - CFBundleURLName: com.masterfabric.projectTracker.macos
            CFBundleURLSchemes:
              - mfprojecttracker
    entitlements:
      path: Configs/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.masterfabric.projectTracker
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.masterfabric.projectTracker

  MFTrackerWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Widgets
    dependencies:
      - package: MFTrackerKit
        product: MFTrackerKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.masterfabric.projectTracker.macos.widgets
        PRODUCT_NAME: MFTrackerWidgets
        INFOPLIST_FILE: Configs/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configs/Widgets.entitlements
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks", "@executable_path/../../../../Frameworks"]
        SKIP_INSTALL: true
        # Env.xcconfig (+ GeneratedEnv) supplies GRAPHQL_URL / MF_* — do not blank MF_APP_API_KEY here.
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGNING_REQUIRED: true
        CODE_SIGNING_ALLOWED: true
        DEVELOPMENT_TEAM: "4GW994398K"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Configs/Widgets-Info.plist
      properties:
        # Gallery / search: "pro", "project", "tracker", "MF"
        CFBundleDisplayName: Project Tracker
        # Bump so WidgetKit/chronod invalidates archived timeline chrome after layout changes.
        CFBundleShortVersionString: "1.0.12"
        CFBundleVersion: "12"
        GRAPHQL_URL: $(GRAPHQL_URL)
        MF_CLIENT_BUNDLE_ID: $(MF_CLIENT_BUNDLE_ID)
        MF_APP_API_KEY: $(MF_APP_API_KEY)
        MF_PROJECT_TRACKER_PARTICULAR: $(MF_PROJECT_TRACKER_PARTICULAR)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Configs/Widgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - group.com.masterfabric.projectTracker
        keychain-access-groups:
          - $(AppIdentifierPrefix)group.com.masterfabric.projectTracker

schemes:
  MFProjectTracker:
    build:
      targets:
        MFProjectTracker: all
        MFTrackerWidgets: all
    run:
      config: Debug
    archive:
      config: Release
