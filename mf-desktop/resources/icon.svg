<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    MF Project Tracker - desktop app icon
    Brand: MasterFabric slate #1E293B + geometric bar mark (masterfabric.co)
    Product: subtle checklist ticket in the lower-right (readable at 16px and 512px)
  -->
  <defs>
    <clipPath id="icon-round">
      <rect width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
    <linearGradient id="topLift" x1="512" y1="0" x2="512" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" ry="224" fill="#1E293B"/>

  <rect
    x="0" y="0" width="1024" height="420"
    fill="url(#topLift)"
    clip-path="url(#icon-round)"
    opacity="0.18"
  />

  <!-- Official MasterFabric geometric mark, scaled into the icon -->
  <g transform="translate(512 470) scale(3.15) translate(-96 -76)">
    <path d="M96.7465 -0.00150013L82.6484 14.084L177.184 108.536L191.282 94.4501L96.7465 -0.00150013Z" fill="#F8FAFC"/>
    <path d="M14.0981 110.627L0 96.541L94.5359 2.08942L108.634 16.1749L14.0981 110.627Z" fill="#F8FAFC"/>
    <path d="M55.0082 151.505L40.9102 137.42L135.446 42.9683L149.544 57.0538L55.0082 151.505Z" fill="#F8FAFC"/>
    <path d="M59.7973 41.5083L45.6992 55.5938L140.235 150.045L154.333 135.96L59.7973 41.5083Z" fill="#F8FAFC"/>
  </g>

  <!-- Tracker ticket badge -->
  <g transform="translate(668 668)">
    <rect x="0" y="0" width="232" height="232" rx="48" fill="#0F172A"/>
    <rect x="12" y="12" width="208" height="208" rx="40" fill="#334155"/>
    <rect x="48" y="64" width="28" height="28" rx="6" fill="#F8FAFC"/>
    <path d="M54 78 L60 84 L74 68" stroke="#1E293B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="92" y="70" width="92" height="16" rx="4" fill="#94A3B8"/>
    <rect x="48" y="118" width="28" height="28" rx="6" fill="#64748B"/>
    <rect x="92" y="124" width="72" height="16" rx="4" fill="#64748B"/>
    <rect x="48" y="172" width="28" height="28" rx="6" fill="#475569"/>
    <rect x="92" y="178" width="56" height="16" rx="4" fill="#475569"/>
  </g>
</svg>
